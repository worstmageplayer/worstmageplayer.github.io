<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Cleaner</title>
<style>
:root{--bg:#f6f6f4;--fg:#1d1d1f;--mut:#6b6b72;--pane:#fff;--bd:#dcdce0;--inv:#d93636;--sp:#c47a0a;--typo:#2f6fdb;--hg:#8a3ffc;--oth:#8e8e96;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#151517;--fg:#ececf0;--mut:#9a9aa3;--pane:#1e1e21;--bd:#34343b;--inv:#ff5b5b;--sp:#f0a030;--typo:#5b93ff;--hg:#b07cff;--oth:#8a8a94}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg)}
.wrap{max-width:1300px;margin:0 auto;padding:20px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;margin:0}
header p{margin:0;color:var(--mut);font-size:13.5px}
.opts{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
fieldset{border:1px solid var(--bd);border-radius:10px;background:var(--pane);padding:6px 14px 10px;margin:0;flex:1 1 260px}
legend{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:0 4px}
label{display:block;font-size:13.5px;padding:2px 0;cursor:pointer}
label.hi{font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.pane{background:var(--pane);border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.pane h2{margin:0;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--bd)}
button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:inherit;cursor:pointer;margin-left:6px}
button:hover{border-color:var(--mut)}
textarea,.insp{font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:0;background:transparent;color:inherit;padding:12px;height:360px;width:100%;overflow:auto;white-space:pre-wrap;word-break:break-word;outline:none;tab-size:4;resize:vertical;margin:0}
.insp{resize:none}
.out textarea{height:260px}
.ph,.mut{color:var(--mut);font-family:system-ui,sans-serif;font-weight:400}
.legend{font-weight:400;font-size:11.5px;color:var(--mut)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 9px;background:var(--c)}
.inv{--c:var(--inv)}.sp,.nl{--c:var(--sp)}.typo,.nfkc{--c:var(--typo)}.hg,.warn{--c:var(--hg)}.other,.keep,.line{--c:var(--oth)}
.b{display:inline-block;font:600 9.5px/1 system-ui,sans-serif;padding:2px 3px;margin:0 1px;border-radius:3px;vertical-align:1px;color:#fff;background:var(--c);cursor:help}
.b.off{background:transparent;color:var(--c);outline:1px dashed var(--c);outline-offset:-1px}
.g{border-radius:2px;background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset 0 -2px var(--c);cursor:help}
.g.other{box-shadow:none}
.g.off{background:none;box-shadow:inset 0 -1px var(--c)}
.sum{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--bd);min-height:38px;align-items:center}
.sum:empty{display:none}
.chip{font-size:12.5px;padding:2px 9px;border-radius:6px;background:var(--bg);border-left:3px solid var(--c)}
.chip.off{opacity:.65}
.chip small{color:var(--mut);margin-left:4px;font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Text Cleaner</h1><p>Runs entirely in your browser. Hover any highlight for details.</p></header>
<section class="opts" id="opts"></section>
<div class="grid">
<div class="pane"><h2>Input<span><button id="paste">Paste</button><button id="clear">Clear</button></span></h2><textarea id="in" spellcheck="false" placeholder="Paste text here…"></textarea></div>
<div class="pane"><h2>Inspector<span class="legend"><i class="sw inv"></i>removed<i class="sw sp"></i>normalized<i class="sw typo"></i>typography<i class="sw hg"></i>suspicious<i class="sw other"></i>other</span></h2><div id="insp" class="insp"></div></div>
</div>
<div class="pane out"><h2>Output<span><span id="count" class="mut"></span><button id="copy">Copy</button></span></h2><div id="sum" class="sum"></div><textarea id="out" readonly spellcheck="false"></textarea></div>
</div>
<script>
const OPTS = [
  ['Characters', [['invisible', 'Remove invisible characters', 1], ['spaces', 'Normalize unusual spaces', 1], ['newlines', 'Normalize line breaks to LF', 1]]],
  ['Lines', [['trailing', 'Strip trailing whitespace', 1], ['blank', 'Collapse multiple blank lines', 1], ['trim', 'Trim leading/trailing blank lines', 1], ['collapse', 'Collapse repeated spaces', 0], ['tabs', 'Convert tabs to 4 spaces', 0], ['unwrap', 'Unwrap hard-wrapped lines (PDF/email)', 0, 1]]],
  ['Typography', [['typography', 'Straighten quotes, dashes, ellipses', 0], ['nfkc', 'NFKC normalize (ligatures, fullwidth)', 0]]]
];

const CAT = {
  inv: { opt: 'invisible', on: 'invisible removed', off: 'invisible found' },
  sp: { opt: 'spaces', on: 'unusual spaces → space', off: 'unusual spaces found' },
  nl: { opt: 'newlines', on: 'line breaks → LF', off: 'non-LF line breaks found' },
  typo: { opt: 'typography', on: 'quotes/dashes straightened', off: 'smart quotes/dashes found' },
  nfkc: { opt: 'nfkc', on: 'compatibility chars normalized', off: 'compatibility chars found' }
};

const LINE = [['tabs', 'tabs → spaces'], ['trailing', 'lines had trailing whitespace stripped'], ['collapse', 'space runs collapsed'], ['unwrap', 'wrapped lines joined'], ['blank', 'blank-line runs collapsed'], ['trim', 'leading/trailing blank lines trimmed']];
const FLAGS = [['hg', 'possible lookalike letters (unchanged)'], ['warn', 'suspicious characters (unchanged)'], ['other', 'other non-ASCII (unchanged)'], ['keep', 'joiners kept inside emoji/scripts']];

const T = new Map();
const add = (cat, rows, extra = {}) => rows.forEach(([cp, label, name, rep]) => T.set(cp, { cat, label, name, rep, ...extra }));

add('inv', [
  [0x200B, 'ZWSP', 'ZERO WIDTH SPACE'], [0x200C, 'ZWNJ', 'ZERO WIDTH NON-JOINER'], [0x200D, 'ZWJ', 'ZERO WIDTH JOINER'],
  [0x2060, 'WJ', 'WORD JOINER'], [0x2061, 'FA', 'FUNCTION APPLICATION'], [0x2062, 'IT', 'INVISIBLE TIMES'],
  [0x2063, 'IS', 'INVISIBLE SEPARATOR'], [0x2064, 'IP', 'INVISIBLE PLUS'], [0xFEFF, 'BOM', 'ZERO WIDTH NO-BREAK SPACE / BOM'],
  [0x00AD, 'SHY', 'SOFT HYPHEN'], [0x034F, 'CGJ', 'COMBINING GRAPHEME JOINER'], [0x180E, 'MVS', 'MONGOLIAN VOWEL SEPARATOR'],
  [0x115F, 'HCF', 'HANGUL CHOSEONG FILLER'], [0x1160, 'HJF', 'HANGUL JUNGSEONG FILLER'], [0x3164, 'HF', 'HANGUL FILLER'],
  [0xFFA0, 'HWHF', 'HALFWIDTH HANGUL FILLER'], [0x200E, 'LRM', 'LEFT-TO-RIGHT MARK'], [0x200F, 'RLM', 'RIGHT-TO-LEFT MARK'],
  [0x061C, 'ALM', 'ARABIC LETTER MARK'], [0x202A, 'LRE', 'LEFT-TO-RIGHT EMBEDDING'], [0x202B, 'RLE', 'RIGHT-TO-LEFT EMBEDDING'],
  [0x202C, 'PDF', 'POP DIRECTIONAL FORMATTING'], [0x202D, 'LRO', 'LEFT-TO-RIGHT OVERRIDE'], [0x202E, 'RLO', 'RIGHT-TO-LEFT OVERRIDE'],
  [0x2066, 'LRI', 'LEFT-TO-RIGHT ISOLATE'], [0x2067, 'RLI', 'RIGHT-TO-LEFT ISOLATE'], [0x2068, 'FSI', 'FIRST STRONG ISOLATE'],
  [0x2069, 'PDI', 'POP DIRECTIONAL ISOLATE'], [0xFFF9, 'IAA', 'INTERLINEAR ANNOTATION ANCHOR'],
  [0xFFFA, 'IAS', 'INTERLINEAR ANNOTATION SEPARATOR'], [0xFFFB, 'IAT', 'INTERLINEAR ANNOTATION TERMINATOR']
]);
for (let cp = 0x206A; cp <= 0x206F; cp++) T.set(cp, { cat: 'inv', label: 'DEPR', name: 'DEPRECATED FORMAT CHARACTER' });

add('sp', [
  [0x00A0, 'NBSP', 'NO-BREAK SPACE'], [0x1680, 'OSM', 'OGHAM SPACE MARK'], [0x2000, 'NQSP', 'EN QUAD'], [0x2001, 'MQSP', 'EM QUAD'],
  [0x2002, 'ENSP', 'EN SPACE'], [0x2003, 'EMSP', 'EM SPACE'], [0x2004, '3MSP', 'THREE-PER-EM SPACE'], [0x2005, '4MSP', 'FOUR-PER-EM SPACE'],
  [0x2006, '6MSP', 'SIX-PER-EM SPACE'], [0x2007, 'FSP', 'FIGURE SPACE'], [0x2008, 'PSP', 'PUNCTUATION SPACE'], [0x2009, 'THSP', 'THIN SPACE'],
  [0x200A, 'HSP', 'HAIR SPACE'], [0x202F, 'NNBSP', 'NARROW NO-BREAK SPACE'], [0x205F, 'MMSP', 'MEDIUM MATHEMATICAL SPACE'],
  [0x3000, 'IDSP', 'IDEOGRAPHIC SPACE']
].map(r => [...r, ' ']));

add('nl', [
  [0x0085, 'NEL', 'NEXT LINE'], [0x2028, 'LS', 'LINE SEPARATOR'], [0x2029, 'PS', 'PARAGRAPH SEPARATOR'],
  [0x000B, 'VT', 'VERTICAL TAB'], [0x000C, 'FF', 'FORM FEED']
].map(r => [...r, '\n']), { br: true });

add('typo', [
  [0x2018, '‘', 'LEFT SINGLE QUOTATION MARK', "'"], [0x2019, '’', 'RIGHT SINGLE QUOTATION MARK', "'"],
  [0x201A, '‚', 'SINGLE LOW-9 QUOTATION MARK', "'"], [0x201B, '‛', 'SINGLE HIGH-REVERSED-9 QUOTATION MARK', "'"],
  [0x2032, '′', 'PRIME', "'"], [0x201C, '“', 'LEFT DOUBLE QUOTATION MARK', '"'], [0x201D, '”', 'RIGHT DOUBLE QUOTATION MARK', '"'],
  [0x201E, '„', 'DOUBLE LOW-9 QUOTATION MARK', '"'], [0x201F, '‟', 'DOUBLE HIGH-REVERSED-9 QUOTATION MARK', '"'],
  [0x2033, '″', 'DOUBLE PRIME', '"'], [0x2010, '‐', 'HYPHEN', '-'], [0x2011, '‑', 'NON-BREAKING HYPHEN', '-'],
  [0x2012, '‒', 'FIGURE DASH', '-'], [0x2013, '–', 'EN DASH', '-'], [0x2014, '—', 'EM DASH', '-'],
  [0x2015, '―', 'HORIZONTAL BAR', '-'], [0x2212, '−', 'MINUS SIGN', '-'], [0x2026, '…', 'HORIZONTAL ELLIPSIS', '...']
]);

const EMOJI = /\u{1F3F4}[\u{E0020}-\u{E007E}]+\u{E007F}|[0-9#*]\uFE0F?\u20E3|[\u{1F1E6}-\u{1F1FF}]{2}|\p{Extended_Pictographic}[\uFE0E\uFE0F]?[\u{1F3FB}-\u{1F3FF}]?(?:\u200D\p{Extended_Pictographic}\uFE0F?[\u{1F3FB}-\u{1F3FF}]?)*/yu;
const LATIN = /\p{Script=Latin}/u;
const LOOK = /[\p{Script=Cyrillic}\p{Script=Greek}\p{Script=Armenian}]/u;
const HAN = /\p{Script=Han}/u;
const SCRIPTS = ['Latin', 'Greek', 'Cyrillic', 'Armenian', 'Hebrew', 'Arabic', 'Devanagari', 'Bengali', 'Thai', 'Hangul', 'Hiragana', 'Katakana', 'Han'].map(s => [s, new RegExp(`\\p{Script=${s}}`, 'u')]);

const hex = cp => cp.toString(16).toUpperCase().padStart(4, '0');
const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const chr = cp => String.fromCodePoint(cp);
const isVS = cp => (cp >= 0xFE00 && cp <= 0xFE0F) || (cp >= 0xE0100 && cp <= 0xE01EF);
const joins = cp => cp >= 0x80 && /[\p{L}\p{M}]/u.test(chr(cp)) && !LATIN.test(chr(cp));
const scriptName = c => /\p{Script=Cyrillic}/u.test(c) ? 'Cyrillic' : /\p{Script=Greek}/u.test(c) ? 'Greek' : 'Armenian';

function describe(c) {
  const cp = c.codePointAt(0);
  if ((cp >= 0xE000 && cp <= 0xF8FF) || cp >= 0xF0000) return 'PRIVATE USE CHARACTER';
  if (/\p{Extended_Pictographic}/u.test(c)) return 'emoji / pictograph';
  const mark = /\p{M}/u.test(c);
  for (const [s, re] of SCRIPTS) if (re.test(c)) return `${s} ${mark ? 'combining mark' : 'character'}`;
  if (mark) return 'combining mark';
  if (/\p{Sc}/u.test(c)) return 'currency symbol';
  if (/\p{N}/u.test(c)) return 'number';
  if (/\p{P}/u.test(c)) return 'punctuation';
  if (/\p{S}/u.test(c)) return 'symbol';
  return 'character';
}

function lookalikes(src) {
  const set = new Set();
  for (const m of src.matchAll(/[\p{L}\p{M}]+/gu)) {
    const w = m[0];
    if (!LATIN.test(w) || !LOOK.test(w)) continue;
    let p = m.index;
    for (const ch of w) {
      if (LOOK.test(ch)) set.add(p);
      p += ch.length;
    }
  }
  return set;
}

function classify(cp, c, prev, next, isLook) {
  if (cp === 9 || cp === 10 || (cp >= 0x20 && cp < 0x7F)) return null;
  if (cp === 13) return next === 10
    ? { cat: 'nl', label: 'CRLF', name: 'CARRIAGE RETURN (part of CRLF)', rep: '' }
    : { cat: 'nl', label: 'CR', name: 'CARRIAGE RETURN', rep: '\n', br: true };
  const e = T.get(cp);
  if (e) {
    if ((cp === 0x200C || cp === 0x200D) && joins(prev) && joins(next)) return { cat: 'keep', label: e.label, name: `${e.name} (kept: joins letters)` };
    return e;
  }
  if (cp >= 0xFE00 && cp <= 0xFE0F) {
    const k = cp - 0xFE00 + 1, label = `VS${k}`, name = `VARIATION SELECTOR-${k}`;
    return prev >= 0x80 && !isVS(prev) && !/\s/u.test(chr(prev))
      ? { cat: 'keep', label, name: `${name} (kept: styles previous character)` }
      : { cat: 'inv', label, name };
  }
  if (cp >= 0xE0100 && cp <= 0xE01EF) {
    const k = cp - 0xE0100 + 17, label = `VS${k}`, name = `VARIATION SELECTOR-${k}`;
    return prev > 0 && !isVS(prev) && HAN.test(chr(prev))
      ? { cat: 'keep', label, name: `${name} (kept: ideographic variant)` }
      : { cat: 'inv', label, name };
  }
  if (cp >= 0xE0000 && cp <= 0xE007F) {
    const ch = cp >= 0xE0020 && cp <= 0xE007E ? String.fromCharCode(cp - 0xE0000) : '';
    return { cat: 'inv', label: 'TAG', name: ch ? `TAG CHARACTER (hidden "${ch}")` : 'TAG CHARACTER', tag: ch };
  }
  if (cp < 0x20 || (cp >= 0x7F && cp <= 0x9F)) return { cat: 'inv', label: cp < 0x20 ? '^' + String.fromCharCode(cp + 64) : cp === 0x7F ? 'DEL' : 'C1', name: 'CONTROL CHARACTER' };
  if (cp >= 0xD800 && cp <= 0xDFFF) return { cat: 'inv', label: 'SURR', name: 'LONE SURROGATE (broken encoding)' };
  if (isLook) return { cat: 'hg', name: `${scriptName(c)} letter inside a Latin word (possible lookalike)` };
  if (cp === 0xFFFD) return { cat: 'warn', name: 'REPLACEMENT CHARACTER (likely encoding error)' };
  if (/\p{Cf}/u.test(c)) return { cat: 'warn', label: 'FMT', name: 'FORMAT CHARACTER' };
  if (/\p{Cn}/u.test(c)) return { cat: 'warn', name: 'UNASSIGNED CODE POINT' };
  const nk = c.normalize('NFKC');
  if (nk !== c) return { cat: 'nfkc', name: `COMPATIBILITY CHARACTER → "${nk}"` };
  return { cat: 'other', name: describe(c) };
}

function scan(src, o) {
  const look = lookalikes(src);
  const n = { inv: {}, sp: {}, nl: {}, typo: {}, nfkc: {}, keep: 0, hg: 0, warn: 0, other: 0, tabs: 0, trailing: 0, collapse: 0, unwrap: 0, blank: 0, trim: 0, tag: '' };
  let out = '', html = '', pos = 0, prev = -1;
  while (pos < src.length) {
    const cp = src.codePointAt(pos), c = chr(cp);
    if (cp >= 0x80 || cp === 0x23 || cp === 0x2A || (cp >= 0x30 && cp <= 0x39)) {
      EMOJI.lastIndex = pos;
      const m = EMOJI.exec(src);
      if (m && m[0].length > c.length) {
        const seq = m[0], cps = [...seq];
        out += seq;
        html += `<span class="g other" title="${cps.map(x => 'U+' + hex(x.codePointAt(0))).join(' ')} emoji sequence">${esc(seq)}</span>`;
        n.other++;
        pos += seq.length;
        prev = cps[cps.length - 1].codePointAt(0);
        continue;
      }
    }
    const next = src.codePointAt(pos + c.length);
    const k = classify(cp, c, prev, next, look.has(pos));
    pos += c.length;
    prev = cp;
    if (!k) {
      out += c;
      html += esc(c);
      continue;
    }
    const meta = CAT[k.cat], on = meta ? o[meta.opt] : false;
    if (meta) {
      const key = k.label || c;
      n[k.cat][key] = (n[k.cat][key] || 0) + 1;
    } else n[k.cat]++;
    if (k.tag) n.tag += k.tag;
    out += on && k.cat !== 'nfkc' ? (k.rep ?? '') : c;
    const title = esc(`U+${hex(cp)} ${k.name}`), cls = k.cat + (meta && !on ? ' off' : '');
    html += k.label && k.cat !== 'typo'
      ? `<span class="b ${cls}" title="${title}">${esc(k.label)}</span>${k.br ? '\n' : ''}`
      : `<span class="g ${cls}" title="${title}">${esc(c)}</span>`;
  }
  return { out, html, n };
}

function unwrap(s, n) {
  const lines = s.split('\n');
  const lens = lines.map(l => l.trimEnd().length).filter(x => x > 0).sort((a, b) => a - b);
  if (lens.length < 2) return s;
  const w = lens[Math.floor(lens.length * 0.75)];
  const END = /[.!?:;。！？]["'”’)\]]*$/u;
  const START = /^\s*(?:[-*•‣◦▪–>#]+\s|\d+[.)]\s|[A-Za-z][.)]\s)/;
  const out = [];
  let last = 0;
  for (const line of lines) {
    const i = out.length - 1, p = i >= 0 ? out[i].trimEnd() : '';
    if (p && line.trim() && last >= w * 0.6 && (!END.test(p) || last >= w * 0.9) && !START.test(line)) {
      n.unwrap++;
      out[i] = /\p{L}-$/u.test(p) && /^\s*\p{Ll}/u.test(line) ? p.slice(0, -1) + line.trimStart() : `${p} ${line.trimStart()}`;
      last = line.trim().length;
    } else {
      out.push(line);
      last = line.trimEnd().length;
    }
  }
  return out.join('\n');
}

function fixLines(s, o, n) {
  if (o.tabs) s = s.replace(/\t/g, () => (n.tabs++, '    '));
  if (o.trailing) s = s.replace(/[ \t]+$/gm, () => (n.trailing++, ''));
  if (o.collapse) s = s.replace(/(\S) {2,}/g, (m, a) => (n.collapse++, a + ' '));
  if (o.unwrap) s = unwrap(s, n);
  if (o.blank) s = s.replace(/\n(?:[ \t]*\n){2,}/g, () => (n.blank++, '\n\n'));
  if (o.trim) {
    const t = s.replace(/^(?:[ \t]*\n)+/, '').replace(/\s+$/, '');
    if (t !== s) n.trim = 1;
    s = t;
  }
  return s;
}

const chip = (cls, count, label, detail = '', off = false) =>
  `<span class="chip ${cls}${off ? ' off' : ''}">${count !== '' ? `<b>${count}</b> ` : ''}${esc(label)}${detail ? `<small>${esc(detail)}</small>` : ''}</span>`;

function summarize(n, o) {
  const chips = [];
  for (const [cat, meta] of Object.entries(CAT)) {
    const e = Object.entries(n[cat]);
    if (!e.length) continue;
    const on = o[meta.opt];
    chips.push(chip(cat, e.reduce((a, [, v]) => a + v, 0), on ? meta.on : meta.off, e.map(([k, v]) => `${k}×${v}`).join(' '), !on));
  }
  if (n.tag) chips.push(chip('inv', '', 'hidden tag text:', `"${n.tag}"`));
  for (const [k, label] of LINE) if (n[k]) chips.push(chip('line', k === 'trim' ? '' : n[k], label));
  for (const [k, label] of FLAGS) if (n[k]) chips.push(chip(k === 'keep' ? 'other' : k, n[k], label));
  return chips.join('') || '<span class="mut">Nothing to clean.</span>';
}

const $ = id => document.getElementById(id);
const inEl = $('in'), outEl = $('out'), insp = $('insp'), sum = $('sum'), count = $('count'), optsEl = $('opts');
const PH = '<span class="ph">Paste text on the left to see what’s in it.</span>';

optsEl.innerHTML = OPTS.map(([g, items]) =>
  `<fieldset><legend>${g}</legend>${items.map(([k, l, d, hi]) =>
    `<label${hi ? ' class="hi"' : ''}><input type="checkbox" name="${k}"${d ? ' checked' : ''}> ${l}</label>`).join('')}</fieldset>`).join('');

const opts = () => Object.fromEntries([...optsEl.querySelectorAll('input')].map(i => [i.name, i.checked]));

function run() {
  const src = inEl.value, o = opts();
  const r = scan(src, o);
  let s = o.nfkc ? r.out.normalize('NFKC') : r.out;
  s = fixLines(s, o, r.n);
  insp.innerHTML = src ? r.html : PH;
  outEl.value = s;
  sum.innerHTML = src ? summarize(r.n, o) : '';
  count.textContent = src ? `${src.length.toLocaleString()} → ${s.length.toLocaleString()} chars` : '';
}

let timer;
inEl.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(run, 120);
});
optsEl.addEventListener('change', run);

$('clear').onclick = () => {
  inEl.value = '';
  run();
  inEl.focus();
};

$('paste').onclick = async () => {
  try {
    inEl.value = await navigator.clipboard.readText();
    run();
  } catch {
    inEl.focus();
  }
};

$('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(outEl.value);
  } catch {
    outEl.select();
    document.execCommand('copy');
  }
  $('copy').textContent = 'Copied';
  setTimeout(() => $('copy').textContent = 'Copy', 1200);
};

run();
</script>
</body>
</html>
