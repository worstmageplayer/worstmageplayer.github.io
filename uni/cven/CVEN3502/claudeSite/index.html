/* ============================== STORAGE HOOK ============================== */
function useCloudState(key, initialValue) {
  const [value, setValue] = useState(initialValue);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        if (window.storage) {
          const res = await window.storage.get(key);
          if (!cancelled && res && res.value != null) setValue(JSON.parse(res.value));
        }
      } catch (e) { /* no stored value yet */ }
      finally { if (!cancelled) setLoaded(true); }
    })();
    return () => { cancelled = true; };
  }, [key]);
  const update = useCallback((updater) => {
    setValue(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      try { if (window.storage) window.storage.set(key, JSON.stringify(next)).catch(()=>{}); } catch (e) {}
      return next;
    });
  }, [key]);
  return [value, update, loaded];
}

function Tex({ children, block = false, className = "" }) {

{

{

{
  id: 't-sludgefrac', category: 'treatment', lecture: 'Sludge Management',
  name: 'Sludge Moisture & Solids Fraction',

  ],
  meaning: 'Sludge is described by two mass fractions that must sum to 1: how much of its total mass is water versus dry solids. A "5% solids" sludge is 95% water by mass — this is deceptively wet-sounding but is standard notation across dewatering/thickening literature.',

  rearrange: 'M_s = P_s(M_w+M_s) = P_s·M_{sludge, total} — the usual first step once total sludge mass and %solids are known.',
  mistake: 'Reading "5.5% solids (by weight)" and thinking P_s=0.055 is a *volume* fraction — it is not; you must bring in specific gravity to get volume.',

{
  id: 't-sludgesg', category: 'treatment', lecture: 'Sludge Management',
  name: 'Sludge Specific Gravity (Mass Balance)',
  tex: '\\dfrac{M_s}{S_s\\rho} = \\dfrac{M_v}{S_v\\rho} + \\dfrac{M_f}{S_f\\rho}',

  vars: [
    {sym:'S_s', meaning:'specific gravity of the dry solids (combined volatile + fixed)', unit:'—'},

    {sym:'S_v, S_f', meaning:'specific gravity of volatile solids (~1.0) and fixed solids (~2.5)', unit:'—'},

    {sym:'S_w', meaning:'specific gravity of water (=1.0)', unit:'—'},
  ],
  meaning: 'Both lines are the same trick applied twice: volume is additive even when mass and density are not, so "total volume = Σ(mass/density)" lets you back out an effective specific gravity for a mixture — first for the dry-solids mixture (volatile + fixed), then for the whole wet sludge (water + solids).',
  when: 'Whenever you need the specific gravity of a sludge (S_sl) to then compute a sludge *volume* from a known *mass* — this pairs directly with the V_sl formula below.',

},
{
  id: 't-sludgevol', category: 'treatment', lecture: 'Sludge Management',
  name: 'Sludge Volume from Solids Mass',
  tex: 'V_{sl} = \\dfrac{M_s}{S_{sl}\\,\\rho\\,P_s}',

    {sym:'P_s', meaning:'solids fraction (by mass) of the sludge', unit:'—'},
  ],
  meaning: 'This ties the whole sludge-management chain together: dry solids mass ÷ solids fraction gives total (wet) sludge mass, then ÷ (S_sl·ρ) converts that mass to a volume. It is the formula behind "why dewatering shrinks sludge volume so dramatically" — increasing P_s from 3% to 20% shrinks V_sl by roughly a factor of 6-7, which is the whole economic case for dewatering.',

{

  tex: 'P = \\sum Q_i \\times TS_i \\times VS_i \\times BMP_i',

{
  id: 'h-boundary', category: 'hydraulics', lecture: 'Open Channel Flow 1 – Uniform Flow',
  name: 'Boundary Shear & Hydraulic Radius',
  tex: '\\tau_o = \\rho g R_h S = \\rho u_*^2',
  extraTex: ['R_h = \\dfrac{A}{P}'],
  vars: [
    {sym:'\\tau_o', meaning:'boundary (bed) shear stress', unit:'Pa'},
    {sym:'R_h', meaning:'hydraulic radius', unit:'m'},
    {sym:'S', meaning:'channel bed slope (uniform flow ⇒ = energy/friction slope)', unit:'m/m'},

    {sym:'A', meaning:'cross-sectional flow area', unit:'m²'},
    {sym:'P', meaning:'wetted perimeter', unit:'m'},
  ],
  meaning: 'In uniform open-channel flow, gravity pulling the water downslope is exactly balanced by friction at the bed — τ_o is that friction force per unit wetted area. R_h = A/P packages the channel geometry into a single length scale (how much cross-section each unit of wetted boundary has to "support") that appears throughout OCF and is the open-channel analogue of pipe diameter.',
  when: 'τ_o for sediment-transport / erosion-threshold checks. R_h in literally every uniform-flow (Manning/Chezy) and Reynolds-number calculation.',

  rearrange: 'u_* = √(τ_o/ρ) = √(gR_hS) — this shear velocity reappears inside the viscous sublayer thickness formula.',
  mistake: 'Using the full channel top width instead of wetted perimeter P, or full cross-section depth instead of R_h, when the channel is only partially full (e.g. circular sewer pipes not flowing full).',

{
  id: 'h-reynolds', category: 'hydraulics', lecture: 'Open Channel Flow 1 – Uniform Flow',
  name: 'Open-Channel Reynolds Number',
  tex: 'Re = \\dfrac{u R_h}{\\nu}',
  extraTex: ['Re_{trans} = \\dfrac{uR_h}{\\nu} = 500-2000'],
  vars: [
    {sym:'Re', meaning:'Reynolds number (open channel form, using R_h not diameter)', unit:'—'},
    {sym:'u', meaning:'cross-sectionally averaged velocity', unit:'m/s'},
  ],
  meaning: 'Same physical idea as pipe-flow Reynolds number (inertial vs viscous forces) but built on R_h instead of D — so the laminar/turbulent transition range (500–2000) looks numerically different from the pipe-flow value (~2300) purely because of that length-scale convention, not because open-channel flow is physically different.',
  when: 'Confirming a channel flow is (almost always, in practice) turbulent before applying Chezy/Manning, which assume fully turbulent, rough-boundary flow.',
  whenNot: 'Don\'t reuse the pipe-flow transitional value (~2300, based on D) here — this sheet\'s Re uses R_h, so compare against 500–2000, not the pipe-flow number.',
  rearrange: 'u = Re·ν/R_h if a critical velocity for transition is wanted.',
  mistake: 'Using pipe diameter D by habit instead of R_h — an easy slip for students coming straight from ENGG2500 pipe-flow problems.',
  links: ['ocf-uniform'],
},
{
  id: 'h-manning', category: 'hydraulics', lecture: 'Open Channel Flow 1 – Uniform Flow',
  name: "Manning's Equation",
  tex: 'u = \\dfrac{R_h^{2/3}S^{1/2}}{n}',
  vars: [
    {sym:'u', meaning:'average velocity (uniform, normal-depth flow)', unit:'m/s'},
    {sym:'n', meaning:"Manning's roughness coefficient", unit:'s/m^{1/3}'},
    {sym:'S', meaning:'bed slope (= energy slope, for uniform flow)', unit:'m/m'},
  ],
  meaning: "The workhorse empirical formula for uniform open-channel flow — an entirely empirical alternative to Chezy, calibrated so that n is roughly constant for a given boundary material (concrete, earth, grass) across a wide range of R_h.",
  when: 'Finding normal depth y_o for a given Q, or velocity/discharge for a given depth, in *uniform* (steady, normal-depth) flow — the single most common open-channel calculation in the course.',
  whenNot: 'Only valid for uniform flow (constant depth along the channel) — never apply directly in a hydraulic jump, GVF profile, or transition region (there, use specific energy instead, though Manning\'s n and S still feed the GVF friction-slope term S_f).',
  rearrange: 'For a given channel geometry, Q = uA is implicit in y_o (both R_h and A depend on y) — normal depth almost always needs trial-and-error / iteration for non-rectangular sections.',
  mistake: "Forgetting Manning's equation is dimensionally inhomogeneous (SI n-values do not transfer to imperial units without a conversion factor) — always confirm you're using an SI-calibrated n.",
  links: ['ocf-uniform'],
  calc: { title:"Manning's equation — velocity", inputs:[
    {key:'Rh', label:'Hydraulic radius, R_h', unit:'m', default:0.75},

},
{
  id: 'h-chezy', category: 'hydraulics', lecture: 'Open Channel Flow 1 – Uniform Flow',
  name: "Chezy Equation & Roughness",
  tex: 'u = C\\sqrt{R_h S}',
  extraTex: ['u = \\sqrt{\\dfrac{8g}{f}}\\sqrt{R_hS}', '\\delta_s = \\dfrac{11.6\\nu}{\\sqrt{gR_hS}} = \\dfrac{11.6\\nu}{u_*}', 'C = 18\\log_{10}\\left(\\dfrac{12R_h}{k_s+\\tfrac{2}{7}\\delta_s}\\right)'],
  vars: [
    {sym:'C', meaning:"Chezy's coefficient", unit:'m^{1/2}/s'},
    {sym:'f', meaning:'Darcy friction factor, open-channel form', unit:'—'},
    {sym:'\\delta_s', meaning:'thickness of the viscous sublayer', unit:'m'},
    {sym:'k_s', meaning:'equivalent sand-grain roughness height', unit:'m'},
  ],
  meaning: 'Chezy is the more physically-grounded rival to Manning — C plays the same role as n but is derived from a Colebrook-White-style relation linking boundary roughness k_s and the (usually tiny) viscous sublayer thickness δ_s. The δ_s term lets C account for whether the boundary is hydraulically smooth, transitional, or fully rough.',
  when: 'Whenever a question gives you k_s (roughness height) rather than a Manning n directly — very common in the "long rectangular channel" style questions on this course\'s past papers.',
  whenNot: "Don't average C and n approaches within one problem — pick whichever the question's given data supports and stay consistent.",
  rearrange: 'This is a 3-equation chain: compute δ_s first (needs R_h, S — so may need an initial guess of R_h/y if solving for normal depth), then C, then u — genuinely iterative when y is the unknown.',
  mistake: 'Trying to compute C without first computing δ_s (it appears inside the log term) — students often skip straight to C using only k_s, dropping the sublayer correction.',
  links: ['ocf-uniform'],
  calc: { title:"Chezy's C (from roughness & sublayer)", inputs:[
    {key:'Rh', label:'Hydraulic radius, R_h', unit:'m', default:0.75},
    {key:'S', label:'Slope, S', unit:'m/m', default:0.0008},
    {key:'ks', label:'Roughness height, k_s', unit:'mm', default:0.3},
  ], compute:(v)=>{
      const nu = 1e-6, g=9.81;
      const ds = 11.6*nu/Math.sqrt(g*v.Rh*v.S);
      return 18*Math.log10((12*v.Rh)/((v.ks/1000)+ (2/7)*ds));
    }, outLabel:'C', outUnit:'m^0.5/s' }
},
{
  id: 'h-froude', category: 'hydraulics', lecture: 'Open Channel Flow 3 – Specific Energy',
  name: 'Froude Number',

  intuition: 'A pump doesn\'t "suck" water up a pipe by magic — it can only work with whatever pressure the incoming flow already has, then adds energy to it. If the pressure on the suction (inlet) side ever drops to the water\'s vapour pressure, the water boils (at ambient temperature — this is pressure-driven boiling, not thermal) and forms vapour bubbles inside the pump. Those bubbles then collapse violently when they reach the higher-pressure discharge side, blasting tiny shockwaves into the impeller — this is cavitation, and it pits and destroys pump internals over time, plus causes noise, vibration, and a sudden efficiency/head collapse. NPSH is simply a bookkeeping tool: how much pressure headroom exists above vapour pressure at the pump inlet, versus how much headroom the specific pump design needs to avoid this.',

    'Setting NPSH_available = NPSH_required and solving for the elevation term is exactly how "maximum pump elevation above the lower reservoir" questions are solved — this pattern (2022 Q5) recurs almost every year in some form.',

  examYield: { level:'high', note:'A Hardy-Cross question has appeared in every past paper reviewed (2021 Q2, two-loop network; 2022 Q6, three-pipe single loop) — reliably one of the last, and often most time-pressured, questions on Part B.' },
  objectives: [

  intuition: 'A looped pipe network can\'t be solved by simple series/parallel algebra because flow can reach any point by more than one path, and there is no single equation with one unknown to isolate. Hardy-Cross sidesteps this by *guessing* first: pick any set of pipe flows that gets continuity right at every junction (as much water enters a node as leaves it) — that\'s easy, there are infinitely many such guesses. The guess will almost certainly be wrong in a different way: going around any closed loop, the head losses won\'t sum to zero (physically, a fluid particle that returns to its starting point must have zero net change in head — if your guessed flows don\'t satisfy that, they\'re not physically real). Hardy-Cross repeatedly nudges the guess, loop by loop, until that head-balance also becomes true, without ever breaking the continuity condition you started with.',
  core: 'Every pipe already obeys h_f=KQ² from Darcy-Weisbach — Hardy-Cross treats each pipe\'s K as fixed and known, and finds the Q values that make head loss balance around every loop simultaneously. For one loop, a single correction ΔQ=−ΣKQ|Q| / Σ|2KQ| is computed from the current flow estimates, then applied to *every* pipe in that loop (added if the pipe\'s assumed direction matches the loop\'s reference direction, subtracted if opposite). This one correction won\'t make the loop\'s head loss exactly zero — you repeat until it does (or until a specified number of cycles is complete, as often requested on exams: "complete one cycle").',
  detail: [
    'Step 1 — Continuity: at every junction, assign flows (with direction) so that inflow = outflow exactly. For a network with one unknown branch flow (e.g. three pipes AB, AC, BC where AB and AC are given and BC must balance the junction), this is a direct subtraction, not an iteration.',
    'Step 2 — Compute K for every pipe: K = fL/(2gDA²) with A=πD²/4, using the Darcy-Weisbach friction factor f for each pipe (given, or read from Moody chart).',
    'Step 3 — Assign a sign convention (commonly clockwise positive) for each loop and record the assumed direction of every pipe\'s flow relative to that convention.',
    'Step 4 — For each loop, compute ΣKQ|Q| (signed, using each pipe\'s current Q with correct sign) and Σ|2KQ| (always positive, magnitude only), then ΔQ = −ΣKQ|Q| / Σ|2KQ|.',
    'Step 5 — Apply the SAME ΔQ to every pipe in that loop: add it to pipes flowing in the loop\'s positive direction, subtract it from pipes flowing in the negative direction. A pipe shared between two loops receives a correction from *each* loop it belongs to.',

    'The two named physical principles: (1) continuity/mass balance at every node, maintained automatically because ΔQ is applied identically to both ends of every pipe; (2) energy conservation around each closed loop (zero net head loss for water returning to its starting point) — this is what each ΔQ correction is driving toward.',
    'Sign safety: use KQ|Q| (not KQ²) in the numerator so that a pipe flowing "backwards" relative to the loop convention contributes a *negative* head-loss term, correctly offsetting pipes flowing "forwards" — this preserves the physical direction information that a naive Q² would erase.',

    working: [

  { id:'pq16', topicId:'membrane', level:2, type:'Understanding', q:'Why does the concentrate stream from an RO plant have a much higher osmotic pressure than the feed?', a:'As water is extracted through the membrane along the module, the remaining feed becomes progressively more concentrated in solute (since solute is mostly rejected) — by the time it exits as concentrate, its solute concentration (and hence osmotic pressure) is substantially higher than at the feed inlet.' },
  { id:'pq17', topicId:'membrane', level:3, type:'Application', q:'A membrane has C_f=1500 mg/L, C_p=250 mg/L. Compute the rejection rate.', given:['C_f=1500 mg/L','C_p=250 mg/L'], required:'R (%)', formula:'R=(Cf−Cp)/Cf×100', substitution:['(1500−250)/1500×100'], working:['1250/1500×100=83.3%'], answer:'R ≈ 83.3%', units:'%', interpretation:'A rejection this high is typical for RO removing dissolved salts; nanofiltration membranes typically show lower rejection for smaller/monovalent ions.' },
  { id:'pq18', topicId:'sludge-management', level:3, type:'Application', q:'A sludge has 4.0% solids (by weight) and specific gravity 1.015. Find the volume of 8000 kg of dry solids as sludge.', given:['P_s=0.040','S_sl=1.015','M_s=8000 kg'], required:'V_sl', formula:'V_sl=Ms/(SslρPs)', substitution:['8000/(1.015×1000×0.040)'], working:['8000/40.6=197.0'], answer:'V_sl ≈ 197 m³', units:'m³', interpretation:'Compare: if this same solids mass were dewatered to 20% solids at similar S_sl, volume would shrink roughly 5-fold to about 39 m³ — illustrating the strong economic incentive for dewatering.' },

  { id:'cc4', category:'hydraulics', deck:'concepts', front:'A hump makes SUPERcritical flow depth do what?', back:'Increase (supercritical flow sits on the lower/shallow branch; losing E moves it to a deeper depth on that branch — opposite of subcritical).' },

  { id:'cc8', category:'hydraulics', deck:'concepts', front:'Why must Hardy-Cross use KQ|Q| rather than KQ²?', back:'Squaring Q destroys its sign/direction information. Using Q|Q| keeps head loss magnitude correct while preserving which pipes flow with vs against the loop\'s reference direction.' },
  { id:'cc9', category:'treatment', deck:'concepts', front:'TS = ? + ?', back:'TS = TDS (total dissolved solids) + TSS (total suspended solids).' },

const GLOSSARY = [
  { term:'Specific Energy (E)', simple:'The energy of the flow measured from the channel bed, not a fixed point.', technical:'E = y + u²/2g — total head H minus bed elevation z. Conserved across lossless transitions except through a bed-elevation change.', example:'Used to find depth changes over a hump or through a contraction.', related:['Critical Depth','Froude Number'], section:'ocf-specific-energy' },
  { term:'Critical Depth (y_c)', simple:'The depth at which a given flow uses the least possible energy.', technical:'y_c=(q²/g)^(1/3), the minimum point of the E-y curve, where Fr=1 exactly.', example:'Marks the boundary between subcritical and supercritical flow.', related:['Specific Energy','Froude Number'], section:'ocf-specific-energy' },
  { term:'Froude Number (Fr)', simple:'A ratio telling you if flow is "fast" or "slow" relative to how fast a wave can travel on it.', technical:'Fr=u/√(gy). Fr<1 subcritical, Fr>1 supercritical, Fr=1 critical.', example:'Fr₁=0.85 → subcritical approach flow to a channel transition.', related:['Critical Depth','Hydraulic Jump'], section:'ocf-specific-energy' },
  { term:'Choking', simple:'When a transition is too big for the flow to get through without changing upstream conditions.', technical:'Occurs when the required Δz (or width change) exceeds Δz_max=E₁−E_min; forces upstream depth to change.', example:'A hump higher than Δz_max forces upstream water level to rise.', related:['Specific Energy','Flow Control'], section:'ocf-specific-energy' },
  { term:'Hydraulic Jump', simple:'A sudden, turbulent transition from fast-shallow to slow-deep flow.', technical:'Momentum-conserved (not energy-conserved) transition from supercritical to subcritical flow; dissipates energy ΔH=(y2-y1)³/4y1y2.', example:'Forms below a sluice gate when tailwater depth is high.', related:['Froude Number','Conjugate Depths'], section:'ocf-jumps' },
  { term:'Normal Depth (y_o)', simple:'The steady depth a channel settles into if left alone for a long, uniform stretch.', technical:'The depth at which S_f=S_o exactly (Manning/Chezy uniform flow condition).', example:'Used as the reference depth in GVF profile classification.', related:['Gradually Varied Flow','Mild/Steep Slope'], section:'ocf-gvf' },
  { term:'Mild Slope', simple:'A channel slope gentle enough that normal flow would be slow/subcritical.', technical:'Defined by y_o > y_c.', example:'Produces M-type GVF profiles (M1, M2, M3).', related:['Steep Slope','Normal Depth'], section:'ocf-gvf' },
  { term:'Steep Slope', simple:'A channel slope steep enough that normal flow would be fast/supercritical.', technical:'Defined by y_o < y_c.', example:'Produces S-type GVF profiles (S1, S2, S3).', related:['Mild Slope','Normal Depth'], section:'ocf-gvf' },
  { term:'NPSH (Net Positive Suction Head)', simple:'A safety margin telling you how close a pump is to cavitating.', technical:'NPSH=(u²/2g+p/ρg)−p_vap/ρg, evaluated at the pump inlet using absolute pressures; must have Available ≥ Required.', example:'Used to find the maximum elevation a pump can be placed above a reservoir.', related:['Cavitation'], section:'pumps' },
  { term:'Cavitation', simple:'Water boiling due to low pressure (not heat), forming and collapsing vapour bubbles that damage pump internals.', technical:'Occurs when local pressure drops to vapour pressure p_vap; bubble collapse causes pitting, noise, vibration, and performance loss.', example:'Most likely at a pump\'s suction side, especially if the pump sits above the water source.', related:['NPSH'], section:'pumps' },
  { term:'Hardy-Cross Method', simple:'A trial-and-correct way to solve looped pipe networks by hand.', technical:'Iteratively applies ΔQ=−Σ(KQ|Q|)/Σ|2KQ| to every pipe in a loop until head losses balance, while preserving continuity at nodes.', example:'Used for any pipe network with closed loops (not simple series/parallel).', related:['Pipe Resistance Coefficient (K)'], section:'pipe-networks' },
  { term:'TS / TDS / TSS', simple:'Total, dissolved, and suspended solids in water — three related measurements of "stuff" in a water sample.', technical:'TS = TDS+TSS. Measured gravimetrically: (mass after − mass before)/volume, with TDS/TSS requiring filtration first.', example:'TS=850 mg/L, TDS=620 mg/L ⇒ TSS=230 mg/L.', related:['Volatile Solids'], section:'characterisation' },

/* ============================== FORMULA CALCULATOR ============================== */
function FormulaCalculator({ calc }) {
  const [vals, setVals] = useState(() => Object.fromEntries(calc.inputs.map(i => [i.key, i.default])));
  const result = useMemo(() => {
    try { return calc.compute(vals); } catch(e) { return NaN; }
  }, [vals, calc]);
  return (
    <div className="bg-ink-800 rounded-lg p-4 sm:p-5 text-white">
      <div className="flex items-center gap-2 mb-4">
        {Ic('bolt','w-4 h-4 text-brass-300')}
        <div className="font-mono text-xs uppercase tracking-widest text-ink-100">{calc.title || 'Live Calculator'}</div>
      </div>
      <div className="grid sm:grid-cols-2 gap-4 mb-4">
        {calc.inputs.map(inp => (
          <div key={inp.key}>
            <div className="flex justify-between items-baseline mb-1">
              <label className="text-xs text-ink-200 font-mono"><Tex>{inp.label}</Tex></label>
              <span className="text-xs text-flow-300 font-mono">{vals[inp.key]} {inp.unit}</span>
            </div>
            <input type="number" step="any" value={vals[inp.key]}
              onChange={e=>setVals(v=>({...v, [inp.key]: parseFloat(e.target.value)}))}
              className="w-full bg-ink-700 border border-ink-600 rounded px-2 py-1.5 text-sm font-mono text-white focus:outline-none focus:ring-1 focus:ring-flow-400"/>
          </div>
        ))}
      </div>
      <div className="border-t border-ink-600 pt-3 flex items-center justify-between">
        <span className="text-sm text-ink-200 font-mono">{calc.outLabel}</span>
        <span className="text-xl font-display font-semibold text-flow-300 font-tnum">
          {Number.isFinite(result) ? (Math.abs(result)>=1000 ? result.toLocaleString(undefined,{maximumFractionDigits:2}) : result.toPrecision(4)) : '—'} <span className="text-sm text-ink-300 font-mono">{calc.outUnit}</span>
        </span>
      </div>
    </div>
  );
}

/* ============================== KNOWLEDGE CHECK (mini quiz within a topic) ============================== */
function KnowledgeCheck({ checks, onComplete }) {
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState({});
  const score = Object.keys(submitted).filter(i => submitted[i]).length;
  return (
    <div className="space-y-4">
      {checks.map((c, i) => {
        const done = i in submitted;
        const correct = answers[i] === c.answer;
        return (
          <div key={i} className="bg-white border border-ink-100 rounded-lg p-4">
            <div className="text-sm font-medium text-ink-800 mb-3">{i+1}. {c.q}</div>
            <div className="space-y-1.5">
              {c.options.map((opt, oi) => {
                let cls = 'border-ink-200 hover:border-flow-300';
                if (done) {
                  if (oi === c.answer) cls = 'border-moss-500 bg-moss-50';
                  else if (oi === answers[i]) cls = 'border-rust-500 bg-rust-50';
                  else cls = 'border-ink-100 opacity-60';
                } else if (answers[i]===oi) cls = 'border-flow-500 bg-flow-50';
                return (
                  <button key={oi} disabled={done} onClick={()=>setAnswers(a=>({...a,[i]:oi}))}
                    className={`w-full text-left text-sm px-3 py-2 rounded-md border transition-colors ${cls}`}>
                    {opt}
                  </button>
                );
              })}
            </div>
            {!done && answers[i] !== undefined && (
              <button onClick={()=>{ setSubmitted(s=>({...s,[i]:true})); if(onComplete) onComplete(i, answers[i]===c.answer); }}
                className="mt-3 text-xs font-medium bg-ink-800 text-white px-3 py-1.5 rounded hover:bg-ink-700">Check answer</button>
            )}
            {done && <div className={`mt-3 text-sm rounded-md p-2.5 ${correct?'bg-moss-50 text-moss-600':'bg-brass-50 text-brass-700'}`}>
              {correct ? '✓ Correct. ' : '✗ Not quite. '}{c.explain}
            </div>}
          </div>
        );
      })}
    </div>
  );
}

        )}

              setProgress(p => {

      <div className="flex justify-between mt-8 pt-5 border-t border-ink-100">

          if (idx<sections.length-1) setActive(sections[idx+1].key);
        }} className="text-sm font-medium text-white bg-flow-600 hover:bg-flow-700 px-4 py-2 rounded-md flex items-center gap-1 disabled:opacity-30" disabled={active===sections[sections.length-1].key}>
          Next {Ic('chevronRight','w-3.5 h-3.5')}

    </div>
  );
}

/* ============================== PAST-PAPER-STYLE PRACTICE MODE (mini session) ============================== */
function PastPaperPracticeMode({ setErrorLog }) {
  const [config, setConfig] = useState({ topic:'all', level:'all', count:5 });
  const [session, setSession] = useState(null); // {questions, idx, results}

  const pool = useMemo(() => PRACTICE_QUESTIONS.filter(q =>
    (config.topic==='all' || q.topicId===config.topic) && (config.level==='all' || q.level===parseInt(config.level))
  ), [config]);

  const start = () => {
    const shuffled = [...pool].sort(()=>Math.random()-0.5).slice(0, config.count);
    setSession({ questions: shuffled, idx: 0, results: [] });
  };
  const answer = (correct) => {
    setErrorLog(log => [...log, { topicId: session.questions[session.idx].topicId, correct, ts: Date.now(), type:'session' }]);
    setSession(s => ({ ...s, results:[...s.results, correct] }));
  };
  const next = () => setSession(s => ({ ...s, idx: s.idx+1 }));

  if (session && session.idx < session.questions.length) {
    const q = session.questions[session.idx];
    return (
      <div className="max-w-3xl">
        <div className="flex items-center justify-between mb-4">
          <div className="font-mono text-xs text-ink-400">Question {session.idx+1} of {session.questions.length}</div>
          <button onClick={()=>setSession(null)} className="text-xs text-ink-400 hover:text-rust-500">End session</button>
        </div>
        <ProgressBar value={session.idx} max={session.questions.length} className="mb-5" />
        <PracticeQuestionCard q={q} onResult={answer} />
        <button onClick={next} className="mt-4 text-sm font-medium text-white bg-ink-800 hover:bg-ink-700 px-4 py-2 rounded-md">
          {session.idx===session.questions.length-1 ? 'Finish session' : 'Next question →'}
        </button>
      </div>
    );
  }
  if (session && session.idx >= session.questions.length) {
    const correct = session.results.filter(Boolean).length;
    return (
      <div className="max-w-lg">
        <Card className="p-6 text-center">
          <div className="font-display text-3xl font-semibold text-ink-800 mb-1">{correct}/{session.results.length}</div>
          <div className="text-sm text-ink-400 mb-4">self-assessed correct</div>
          <ProgressBar value={correct} max={session.results.length} tone="moss" className="mb-5" />
          <button onClick={()=>setSession(null)} className="text-sm font-medium text-white bg-flow-600 hover:bg-flow-700 px-4 py-2 rounded-md">New session</button>
        </Card>
      </div>
    );
  }

  return (
    <div className="max-w-2xl">
      <SectionEyebrow>Custom Practice Session</SectionEyebrow>
      <h1 className="font-display text-2xl sm:text-3xl font-semibold text-ink-800 mb-2">Practice Session Builder</h1>
      <p className="text-ink-500 mb-6">Build a focused practice run — pick a topic, difficulty, and question count.</p>
      <Card className="p-5 space-y-4">
        <div>
          <label className="text-xs font-mono uppercase text-ink-400 block mb-1.5">Topic</label>
          <select value={config.topic} onChange={e=>setConfig(c=>({...c,topic:e.target.value}))} className="w-full text-sm border border-ink-200 rounded-md px-3 py-2">
            <option value="all">Mixed — all topics</option>
            {Object.keys(TOPICS).map(id => <option key={id} value={id}>{TOPICS[id].lecture}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-mono uppercase text-ink-400 block mb-1.5">Difficulty Level</label>
          <select value={config.level} onChange={e=>setConfig(c=>({...c,level:e.target.value}))} className="w-full text-sm border border-ink-200 rounded-md px-3 py-2">
            <option value="all">Mixed levels</option>
            {[1,2,3,4,5].map(l => <option key={l} value={l}>Level {l}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-mono uppercase text-ink-400 block mb-1.5">Number of questions ({config.count})</label>
          <input type="range" min="1" max={Math.max(1,pool.length)} value={Math.min(config.count,Math.max(1,pool.length))} onChange={e=>setConfig(c=>({...c,count:parseInt(e.target.value)}))} className="w-full"/>
        </div>
        <div className="text-xs text-ink-400 font-mono">{pool.length} questions available in this filter</div>
        <button onClick={start} disabled={pool.length===0} className="w-full text-sm font-medium text-white bg-flow-600 hover:bg-flow-700 disabled:opacity-40 px-4 py-2.5 rounded-md flex items-center justify-center gap-2">
          {Ic('play','w-4 h-4')} Start Practice Session
        </button>
      </Card>
    </div>
  );
}

/* ============================== FLASHCARDS VIEW ============================== */
function FlashcardsView({ cardStates, setCardStates }) {
  const [deckFilter, setDeckFilter] = useState('all');
  const [catFilter, setCatFilter] = useState('all');
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);

  const pool = useMemo(() => ALL_FLASHCARDS.filter(c =>
    (deckFilter==='all' || c.deck===deckFilter) && (catFilter==='all' || c.category===catFilter)
  ), [deckFilter, catFilter]);

  useEffect(() => { setIdx(0); setFlipped(false); }, [deckFilter, catFilter]);

  const stageCounts = useMemo(() => {
    const counts = { New:0, Learning:0, Review:0, Mastered:0 };
    pool.forEach(c => {
      const st = (cardStates[c.id] && cardStates[c.id].stage) || 'New';
      counts[st] = (counts[st]||0)+1;
    });
    return counts;
  }, [pool, cardStates]);

  if (pool.length===0) return <div className="text-ink-400 text-sm">No cards in this filter.</div>;
  const card = pool[idx % pool.length];
  const stage = (cardStates[card.id] && cardStates[card.id].stage) || 'New';

  const rate = (newStage) => {
    setCardStates(s => ({ ...s, [card.id]: { stage: newStage, last: Date.now() } }));
    setFlipped(false);
    setIdx(i => (i+1) % pool.length);
  };

  const stageTone = { New:'ink', Learning:'brass', Review:'flow', Mastered:'moss' };

  return (
    <div className="max-w-2xl">
      <SectionEyebrow>Spaced Review</SectionEyebrow>
      <h1 className="font-display text-2xl sm:text-3xl font-semibold text-ink-800 mb-2">Flashcards</h1>
      <p className="text-ink-500 mb-5">{ALL_FLASHCARDS.length} cards across formulas and key concepts. Progress is saved automatically.</p>

      <div className="flex flex-wrap gap-2 mb-4">
        {['all','formulas','concepts'].map(d => (
          <button key={d} onClick={()=>setDeckFilter(d)} className={`px-3 py-1.5 rounded-full text-sm font-medium border ${deckFilter===d?'bg-ink-800 text-white border-ink-800':'bg-white text-ink-600 border-ink-200'}`}>{d==='all'?'All decks':d==='formulas'?'Formulas':'Concepts'}</button>
        ))}
        <span className="w-px bg-ink-200 mx-1"></span>
        {['all','treatment','hydraulics'].map(d => (
          <button key={d} onClick={()=>setCatFilter(d)} className={`px-3 py-1.5 rounded-full text-sm font-medium border ${catFilter===d?'bg-ink-800 text-white border-ink-800':'bg-white text-ink-600 border-ink-200'}`}>{d==='all'?'All':d==='treatment'?'Treatment':'Hydraulics'}</button>
        ))}
      </div>

      <div className="flex gap-1.5 mb-5">
        {Object.entries(stageCounts).map(([k,v]) => (
          <div key={k} className="flex-1 text-center">
            <div className={`h-1.5 rounded-full mb-1 ${k==='New'?'bg-ink-200':k==='Learning'?'bg-brass-300':k==='Review'?'bg-flow-300':'bg-moss-300'}`}></div>
            <div className="text-[10px] font-mono text-ink-400">{k} {v}</div>
          </div>
        ))}
      </div>

      <div className="relative mb-5" style={{minHeight:'220px'}}>
        <button onClick={()=>setFlipped(f=>!f)} className="w-full h-full min-h-[220px] bg-white border border-ink-100 rounded-xl shadow-pop p-8 flex flex-col items-center justify-center text-center hover:shadow-lg transition-shadow">
          <Badge tone={stageTone[stage]}>{stage}</Badge>
          <div className="mt-4">
            {!flipped ? (
              <div>
                {card.frontTex ? <Tex block className="text-xl">{card.frontTex}</Tex> : null}
                <div className="font-display text-lg font-medium text-ink-800 mt-2">{card.front}</div>
              </div>
            ) : (
              <div className="text-ink-700 leading-relaxed max-w-md">{card.back}</div>
            )}
          </div>
          <div className="text-xs text-ink-300 font-mono mt-5">{flipped ? 'Click to see front' : 'Click to reveal answer'}</div>
        </button>
      </div>

      {flipped && (
        <div className="grid grid-cols-4 gap-2 rise-in">
          <button onClick={()=>rate('New')} className="text-xs font-medium py-2 rounded-md bg-ink-50 text-ink-600 border border-ink-200 hover:bg-ink-100">Again</button>
          <button onClick={()=>rate('Learning')} className="text-xs font-medium py-2 rounded-md bg-brass-50 text-brass-700 border border-brass-100 hover:bg-brass-100">Hard</button>
          <button onClick={()=>rate('Review')} className="text-xs font-medium py-2 rounded-md bg-flow-50 text-flow-700 border border-flow-100 hover:bg-flow-100">Good</button>
          <button onClick={()=>rate('Mastered')} className="text-xs font-medium py-2 rounded-md bg-moss-50 text-moss-600 border border-moss-100 hover:bg-moss-100">Easy</button>
        </div>
      )}
      <div className="flex justify-between items-center mt-5 text-xs text-ink-400 font-mono">
        <button onClick={()=>{setIdx(i=>(i-1+pool.length)%pool.length); setFlipped(false);}} className="hover:text-ink-700">← Skip back</button>
        <span>{(idx%pool.length)+1} / {pool.length}</span>
        <button onClick={()=>{setIdx(i=>(i+1)%pool.length); setFlipped(false);}} className="hover:text-ink-700">Skip →</button>
      </div>
    </div>
  );
}

/* ============================== DASHBOARD ============================== */
function Dashboard({ progress, errorLog, onNavigate }) {
  const fullTopicIds = Object.keys(TOPICS);
  const totalSections = fullTopicIds.length * 10;
  const doneSections = fullTopicIds.reduce((sum, tid) => sum + ((progress[tid]?.visited?.length) || 0), 0);
  const overallPct = totalSections ? Math.round((doneSections/totalSections)*100) : 0;

  const weakByTopic = useMemo(() => {
    const m = {};
    errorLog.forEach(e => {
      if (!m[e.topicId]) m[e.topicId] = { correct:0, total:0 };
      m[e.topicId].total++;
      if (e.correct) m[e.topicId].correct++;
    });
    return m;
  }, [errorLog]);
  const weakTopics = Object.entries(weakByTopic)
    .map(([tid, s]) => ({ tid, acc: s.correct/s.total, total: s.total }))
    .filter(w => w.total >= 2 && w.acc < 0.7)
    .sort((a,b) => a.acc - b.acc)
    .slice(0, 4);

  const nextTopic = fullTopicIds.find(tid => !progress[tid] || progress[tid].visited.length < 10) || fullTopicIds[0];
  const topHigh = Object.entries(HIGH_YIELD).sort((a,b) => b[1].totalMarks - a[1].totalMarks).slice(0,5);

  return (
    <div className="max-w-5xl">
      <SectionEyebrow>Term 2 2026 Exam Prep</SectionEyebrow>
      <h1 className="font-display text-2xl sm:text-3xl font-semibold text-ink-800 mb-1">Dashboard</h1>
      <p className="text-ink-500 mb-6">Water Engineering (hydraulics) + Water & Wastewater Treatment, weighted toward what actually shows up on the paper.</p>

      <div className="grid sm:grid-cols-3 gap-4 mb-6">
        <Card className="p-4">
          <div className="text-xs text-ink-400 mb-1.5 font-mono uppercase tracking-wide">Deep-dive coverage</div>
          <div className="flex items-end gap-2 mb-2"><span className="font-display text-2xl font-semibold text-ink-800">{overallPct}%</span><span className="text-xs text-ink-400 mb-1">of full lessons viewed</span></div>
          <ProgressBar value={overallPct} />
        </Card>
        <Card className="p-4">
          <div className="text-xs text-ink-400 mb-1.5 font-mono uppercase tracking-wide">Practice answered</div>
          <div className="font-display text-2xl font-semibold text-ink-800">{errorLog.length}</div>
          <div className="text-xs text-ink-400 mt-1">{errorLog.length ? Math.round(100*errorLog.filter(e=>e.correct).length/errorLog.length) : 0}% correct overall</div>
        </Card>
        <Card className="p-4">
          <div className="text-xs text-ink-400 mb-1.5 font-mono uppercase tracking-wide">Formulas on sheet</div>
          <div className="font-display text-2xl font-semibold text-ink-800">{FORMULAS.length}</div>
          <div className="text-xs text-ink-400 mt-1">{REMOVED_FORMULAS.length} removed vs. prior years</div>
        </Card>
      </div>

      <div className="grid lg:grid-cols-2 gap-4 mb-6">
        <Card className="p-5">
          <div className="font-display font-semibold text-sm text-ink-800 mb-3 flex items-center gap-2">{Ic('play','w-4 h-4 text-flow-500')} Continue studying</div>
          <div className="text-sm text-ink-600 mb-3">Suggested next: <span className="font-medium text-ink-800">{TOPICS[nextTopic]?.lecture}</span></div>
          <button onClick={()=>onNavigate('topic', nextTopic)} className="text-sm font-medium text-white bg-flow-600 hover:bg-flow-700 px-4 py-2 rounded-md">Resume lesson →</button>
        </Card>
        <Card className="p-5">
          <div className="font-display font-semibold text-sm text-ink-800 mb-3 flex items-center gap-2">{Ic('alert','w-4 h-4 text-rust-500')} Weak areas</div>
          {weakTopics.length === 0 ? (
            <p className="text-sm text-ink-400">Not enough practice data yet — answer some practice questions to surface weak spots here.</p>
          ) : (
            <div className="space-y-2">
              {weakTopics.map(w => (
                <button key={w.tid} onClick={()=>onNavigate('topic', w.tid)} className="w-full flex items-center justify-between text-sm bg-rust-50 hover:bg-rust-100/70 rounded-md px-3 py-2 transition-colors">
                  <span className="text-ink-700">{TOPICS[w.tid]?.lecture || w.tid}</span>
                  <span className="font-mono text-xs text-rust-600">{Math.round(w.acc*100)}%</span>
                </button>
              ))}
            </div>
          )}
        </Card>
      </div>

      <Card className="p-5 mb-6">
        <div className="flex items-center justify-between mb-3">
          <div className="font-display font-semibold text-sm text-ink-800 flex items-center gap-2">{Ic('target','w-4 h-4 text-brass-500')} Highest-yield topics (2020–2022)</div>
          <button onClick={()=>onNavigate('high-yield')} className="text-xs text-flow-600 hover:underline">See full breakdown →</button>
        </div>
        <div className="grid sm:grid-cols-5 gap-2.5">
          {topHigh.map(([tid, d]) => (
            <button key={tid} onClick={()=>onNavigate('topic', tid)} className="text-left bg-paper-dim rounded-md p-2.5 hover:bg-flow-50 transition-colors">
              <div className="text-xs font-medium text-ink-700 leading-snug mb-1">{TOPICS[tid]?.lecture || tid}</div>
              <div className="text-[11px] font-mono text-ink-400">{d.totalMarks} marks · {d.count} appearances</div>
            </button>
          ))}
        </div>
      </Card>

      <div className="grid sm:grid-cols-2 gap-4">
        <Card className="p-4">
          <div className="font-display font-semibold text-sm text-ink-800 mb-2">10 fully-built deep-dive lessons</div>
          <p className="text-xs text-ink-500 leading-relaxed mb-2">Specific Energy & Transitions, Hydraulic Jumps, GVF, Pumps/NPSH, Hardy-Cross Pipe Networks, Characterisation, Activated Sludge, Disinfection/CT, Membranes, Sludge Management — chosen from 3 years of past-paper frequency.</p>
        </Card>
        <Card className="p-4">
          <div className="font-display font-semibold text-sm text-ink-800 mb-2">Everything else is a linked outline</div>
          <p className="text-xs text-ink-500 leading-relaxed">Remaining lectures (uniform flow, optimal sections, coagulation/flocculation, filtration, etc.) have objectives + linked formula cards now, with full 10-part lessons to follow.</p>
        </Card>
      </div>
    </div>
  );
}

/* ============================== CONCEPT MAP ============================== */

  const groups = [
    { title:'Open Channel Flow', color:'flow', ids:['ocf-uniform','ocf-optimal','ocf-specific-energy','ocf-transitions','ocf-jumps','ocf-gvf'] },

  return (

      <p className="text-ink-500 mb-6 max-w-2xl">The course splits into two strands taught in parallel — hydraulics (flow-focused) and treatment (process-focused) — that mostly stay independent until pump/pipe design questions and process design overlap.</p>
      <div className="grid md:grid-cols-2 gap-4">
        {groups.map(g => (
          <Card key={g.title} className="p-4">
            <div className={`font-display font-semibold text-sm mb-3 flex items-center gap-2 text-${g.color}-700`}>
              <span className={`w-2.5 h-2.5 rounded-full bg-${g.color}-500`}></span>{g.title}
            </div>
            <div className="space-y-1.5">
              {g.ids.map(id => (
                <button key={id} onClick={()=>onNavigate('topic', id)}
                  className="w-full text-left flex items-center justify-between text-sm px-3 py-2 rounded-md bg-paper-dim hover:bg-flow-50 transition-colors">
                  <span className="text-ink-700">{label(id)}</span>
                  {isFull(id) ? <span className="text-[10px] font-mono text-moss-600">FULL</span> : <span className="text-[10px] font-mono text-ink-400">OUTLINE</span>}
                </button>
              ))}
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ============================== APP SHELL ============================== */
function App() {
  const [nav, setNav] = useState({ view:'dashboard' });
  const [mobileOpen, setMobileOpen] = useState(false);
  const [formulaQuery, setFormulaQuery] = useState('');
  const [glossaryQuery, setGlossaryQuery] = useState('');
  const [progress, setProgress, progressLoaded] = useCloudState('cven3502_progress', {});
  const [errorLog, setErrorLog, errorLogLoaded] = useCloudState('cven3502_errorlog', []);
  const [cardStates, setCardStates, cardsLoaded] = useCloudState('cven3502_flashcards', {});

  const onNavigate = (view, id, extra) => {
    if (view === 'topic') setNav({ view:'topic', topicId:id });
    else if (view === 'formulas') { setNav({ view:'formulas' }); if (extra) setFormulaQuery(''); }
    else setNav({ view });
    window.scrollTo({ top:0, behavior:'auto' });
  };

  let content;
  switch (nav.view) {
    case 'dashboard': content = <Dashboard progress={progress} errorLog={errorLog} onNavigate={onNavigate} />; break;
    case 'concept-map': content = <ConceptMapView onNavigate={onNavigate} />; break;
    case 'formulas': content = <FormulaExplorerView query={formulaQuery} setQuery={setFormulaQuery} />; break;
    case 'high-yield': content = <HighYieldView onNavigate={onNavigate} />; break;
    case 'past-papers': content = <PastPaperAnalysisView onNavigate={onNavigate} />; break;
    case 'past-paper-practice': content = <PastPaperPracticeMode setErrorLog={setErrorLog} />; break;
    case 'practice': content = <PracticeView errorLog={errorLog} setErrorLog={setErrorLog} />; break;
    case 'flashcards': content = <FlashcardsView cardStates={cardStates} setCardStates={setCardStates} />; break;
    case 'glossary': content = <GlossaryView query={glossaryQuery} setQuery={setGlossaryQuery} onNavigate={onNavigate} />; break;
    case 'revision': content = <RevisionModeView />; break;
    case 'exam-strategy': content = <ExamStrategyView />; break;
    case 'topic': content = <TopicView topicId={nav.topicId} onNavigate={onNavigate} progress={progress} setProgress={setProgress} />; break;
    default: content = <Dashboard progress={progress} errorLog={errorLog} onNavigate={onNavigate} />;
  }

  return (
    <div className="min-h-screen bg-paper flex">
      <Sidebar view={nav} setView={setNav} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
      <div className="flex-1 min-w-0">
        <header className="lg:hidden sticky top-0 z-20 bg-paper/95 backdrop-blur-sm border-b border-ink-100 px-4 py-3 flex items-center gap-3">
          <button onClick={()=>setMobileOpen(true)} className="p-1.5 -ml-1.5 text-ink-700">{Ic('layers','w-5 h-5')}</button>
          <div className="font-display font-semibold text-sm text-ink-800">CVEN3502</div>
        </header>
        <main className="px-4 sm:px-8 py-8 sm:py-10">
          {content}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
